name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest available Xcode
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*.app || true
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Selecting: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Cache VLCKit
        id: cache-vlckit
        uses: actions/cache@v4
        with:
          path: Vendor/VLCKit/VLCKit-all.xcframework
          key: vlckit-3.6.0-5da4747e

      - name: Fetch VLCKit
        if: steps.cache-vlckit.outputs.cache-hit != 'true'
        run: |
          chmod +x scripts/fetch-vlckit.sh
          ./scripts/fetch-vlckit.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build Release (unsigned iphoneos)
        run: |
          set -o pipefail
          xcodebuild \
            -project DouDuo.xcodeproj \
            -scheme DouDuo \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO

      - name: Package Unsigned IPA
        run: |
          VER=$(grep -E '^ +MARKETING_VERSION:' project.yml | head -1 | awk '{print $2}')
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R "build/dd/Build/Products/Release-iphoneos/DouDuo.app" build/ipa/Payload/
          (cd build/ipa && zip -qry "../DouDuo-${VER}-unsigned.ipa" Payload)
          ls -lh "build/DouDuo-${VER}-unsigned.ipa"
          echo "IPA_PATH=build/DouDuo-${VER}-unsigned.ipa" >> "$GITHUB_ENV"
          echo "APP_VER=${VER}" >> "$GITHUB_ENV"

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DouDuo-${{ env.APP_VER }}-unsigned-ipa
          path: ${{ env.IPA_PATH }}
          retention-days: 30
